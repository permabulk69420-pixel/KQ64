name: Apply Quest VR UI optical-centre fix

# One-shot source update; this workflow deletes itself after committing the fix.
on:
  push:
    branches:
      - ppsspp-openxr-audit
    paths:
      - tools/apply-quest-vr-ui-optical-centre-fix.py
      - .github/workflows/apply-quest-vr-ui-optical-centre-fix.yml
  pull_request:
    branches:
      - quest-vr-prototype
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - tools/apply-quest-vr-ui-optical-centre-fix.py
      - .github/workflows/apply-quest-vr-ui-optical-centre-fix.yml

permissions:
  contents: write

jobs:
  apply-source-update:
    if: github.head_ref == 'ppsspp-openxr-audit' || github.ref_name == 'ppsspp-openxr-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: ppsspp-openxr-audit
          fetch-depth: 1
          show-progress: false

      - name: Apply UI optical-centre correction
        run: |
          python3 tools/apply-quest-vr-ui-optical-centre-fix.py
          rm tools/apply-quest-vr-ui-optical-centre-fix.py
          rm .github/workflows/apply-quest-vr-ui-optical-centre-fix.yml
          git diff --check

      - name: Commit renderer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct Quest head-stable UI projection centres"
          git push origin HEAD:ppsspp-openxr-audit
