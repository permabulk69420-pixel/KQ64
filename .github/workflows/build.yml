name: Mupen64Plus-AE

on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 9477386

    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'adopt'

    - name: Set up environment variables
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

    - name: Checkout mupen64plus-ae repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Decode debug keystore
      env:
        DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
      run: |
        if [ -z "$DEBUG_KEYSTORE" ]
        then
           echo "No debug keystore value"
        else
           echo $DEBUG_KEYSTORE > debug.keystore.base64
           base64 --decode debug.keystore.base64 > debug.keystore
           sudo cp -f debug.keystore $HOME/.android/.
        fi

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends file gawk unzip

    - name: Validate generated Quest VR shader literals
      run: |
        perl -ne '
          if (/(?<!\\)\\\\n"/) {
            print "$ARGV: accidental literal \\\\n in generated GLSL: $_";
            $bad = 1;
          }
          END { exit($bad ? 1 : 0); }
        ' \
          mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_CombinerProgramBuilderCommon.cpp \
          mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_CombinerProgramBuilderAccurate.cpp \
          mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_CombinerProgramBuilderFast.cpp \
          mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_SpecialShadersFactory.cpp \
          mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_FXAA.cpp

    - name: Build artifact
      run: ./gradlew assemble

    - name: Verify Quest arm64 APK contents
      run: |
        apk="app/build/outputs/apk/release/Mupen64PlusAE-release.apk"
        test -f "$apk"
        unzip -Z1 "$apk" > /tmp/mupen64plus-ae-apk-files.txt
        for library in \
          lib/arm64-v8a/libmupen64plus-quest-vr.so \
          lib/arm64-v8a/libopenxr_loader.so \
          lib/arm64-v8a/libmupen64plus-video-GLideN64.so
        do
          if ! grep -Fxq "$library" /tmp/mupen64plus-ae-apk-files.txt
          then
            echo "Missing required Quest arm64 library: $library"
            grep '^lib/arm64-v8a/' /tmp/mupen64plus-ae-apk-files.txt | sort
            exit 1
          fi
        done

    - name: Declare branch name
      id: branch-name
      uses: tj-actions/branch-names@v8

    - name: Get branch name
      id: var
      run: |
        echo "branch=${{ steps.branch-name.outputs.current_branch }}" >> $GITHUB_OUTPUT

    - name: Declare sha name
      uses: benjlevesque/short-sha@v3.0
      id: short-sha
      with:
        length: 7

    - name: Get sha name
      run: |
        echo $SHA
      env:
        SHA: ${{ steps.short-sha.outputs.sha }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mupen64plus-ae-${{ steps.var.outputs.branch }}-${{ env.SHA }}
        path: ${{ github.workspace }}/app/build/outputs/apk/release/Mupen64PlusAE-release.apk

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout mupen64plus-ae repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Declare branch name
      id: branch-name
      uses: tj-actions/branch-names@v8

    - name: Get branch name
      id: var
      run: |
        echo "branch=${{ steps.branch-name.outputs.current_branch }}" >> $GITHUB_OUTPUT

    - name: Declare sha name
      uses: benjlevesque/short-sha@v3.0
      id: short-sha
      with:
        length: 7

    - name: Get sha name
      run: |
        echo $SHA
      env:
        SHA: ${{ steps.short-sha.outputs.sha }}

    - name: Re-zip artifacts
      run: |
        cd dist
        zip -r mupen64plus-ae-${{ steps.var.outputs.branch }}.zip mupen64plus-ae*

    - name: Update Git Tag
      run: |
        git tag -f Pre-release
        git push -f origin Pre-release

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        prerelease: true
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: false
        tag: Pre-release
        artifacts: "dist/*.zip"
