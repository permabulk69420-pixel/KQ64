name: KQ64

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KQ64
    runs-on: ubuntu-latest

    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file gawk unzip

      - name: Configure persistent signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Using the repository signing key."
          else
            echo "::warning::DEBUG_KEYSTORE is not configured. This CI build will use a runner-generated debug key and must not be published as an update."
          fi

      - name: Require persistent signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "A tagged release requires the persistent DEBUG_KEYSTORE repository secret."
            exit 1
          fi

      - name: Validate generated Quest VR shader literals
        run: |
          perl -ne '
            if (/(?<!\\)\\\\n"/) {
              print "$ARGV: accidental literal \\\\n in generated GLSL: $_";
              $bad = 1;
            }
            END { exit($bad ? 1 : 0); }
          ' \
            mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_CombinerProgramBuilderCommon.cpp \
            mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_CombinerProgramBuilderAccurate.cpp \
            mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_CombinerProgramBuilderFast.cpp \
            mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_SpecialShadersFactory.cpp \
            mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_FXAA.cpp

      - name: Integrate Controls into native Quest launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mapping_path = Path("app/src/main/java/paulscode/android/mupen64plusae/Kq64ControllerMapping.java")
          mapping = mapping_path.read_text(encoding="utf-8")
          mapping = mapping.replace(
              '    private static void show(@NonNull Activity activity) {',
              '    static void show(@NonNull Activity activity) {',
              1,
          )
          mapping = mapping.replace(
              '                drawText(canvas, paint, "CONTROLS", BUTTON_RECT.centerX(),',
              '                MappingView.drawText(canvas, paint, "CONTROLS", BUTTON_RECT.centerX(),',
              1,
          )
          mapping_path.write_text(mapping, encoding="utf-8")

          launcher_path = Path("app/src/main/java/paulscode/android/mupen64plusae/QuestVrLauncherActivity.java")
          launcher = launcher_path.read_text(encoding="utf-8")
          replacements = [
              ('    private static final int ACTION_ADVANCED = 2;\n', '    private static final int ACTION_ADVANCED = 2;\n    private static final int ACTION_CONTROLS = 3;\n'),
              ('                        mSelectedAction = wrap(mSelectedAction + direction, 3);', '                        mSelectedAction = wrap(mSelectedAction + direction, 4);'),
              ('                } else if (x >= 970.0f && x <= 1315.0f) {\n                    mSelectedAction = ACTION_ADVANCED;\n                    action = ACTION_ADVANCED;\n                }', '                } else if (x >= 970.0f && x < 1310.0f) {\n                    mSelectedAction = ACTION_ADVANCED;\n                    action = ACTION_ADVANCED;\n                } else if (x >= 1310.0f && x <= 1540.0f) {\n                    mSelectedAction = ACTION_CONTROLS;\n                    action = ACTION_CONTROLS;\n                }'),
              ('        } else if (action == ACTION_ADVANCED) {\n            startActivity(new Intent(this, GalleryActivity.class));\n            finish();\n            overridePendingTransition(0, 0);\n        }', '        } else if (action == ACTION_ADVANCED) {\n            startActivity(new Intent(this, GalleryActivity.class));\n            finish();\n            overridePendingTransition(0, 0);\n        } else if (action == ACTION_CONTROLS) {\n            Kq64ControllerMapping.show(this);\n        }'),
              ('        drawButton(canvas, paint, new RectF(305, 710, 615, 790), launch,\n                action == ACTION_LAUNCH, focused, !scanning);\n        drawButton(canvas, paint, new RectF(645, 710, 955, 790), "IMPORT GAMES",\n                action == ACTION_IMPORT, focused, !scanning);\n        drawButton(canvas, paint, new RectF(985, 710, 1295, 790), "ADVANCED / LEGACY",\n                action == ACTION_ADVANCED, focused, !scanning);', '        drawButton(canvas, paint, new RectF(120, 710, 445, 790), launch,\n                action == ACTION_LAUNCH, focused, !scanning);\n        drawButton(canvas, paint, new RectF(470, 710, 795, 790), "IMPORT GAMES",\n                action == ACTION_IMPORT, focused, !scanning);\n        drawButton(canvas, paint, new RectF(820, 710, 1145, 790), "ADVANCED / LEGACY",\n                action == ACTION_ADVANCED, focused, !scanning);\n        drawButton(canvas, paint, new RectF(1170, 710, 1495, 790), "CONTROLS",\n                action == ACTION_CONTROLS, focused, !scanning);'),
          ]
          for old, new in replacements:
              if old not in launcher:
                  raise SystemExit(f"Expected launcher source block not found:\n{old}")
              launcher = launcher.replace(old, new, 1)
          launcher = launcher.replace('        Kq64ControllerMapping.installLauncherButton(this);\n', '', 1)
          launcher_path.write_text(launcher, encoding="utf-8")
          print("Integrated Controls as launcher action 4 and removed overlay installation.")
          PY

      - name: Upload corrected controller source
        uses: actions/upload-artifact@v4
        with:
          name: KQ64-controller-source-${{ github.sha }}
          path: |
            app/src/main/java/paulscode/android/mupen64plusae/Kq64ControllerMapping.java
            app/src/main/java/paulscode/android/mupen64plusae/QuestVrLauncherActivity.java
          if-no-files-found: error
          retention-days: 7

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee kq64-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KQ64-build-log-${{ github.sha }}
          path: kq64-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Quest arm64 APK contents
        run: |
          apk="app/build/outputs/apk/release/KQ64-release.apk"
          test -f "$apk"
          unzip -Z1 "$apk" > /tmp/kq64-apk-files.txt
          for library in \
            lib/arm64-v8a/libmupen64plus-quest-vr.so \
            lib/arm64-v8a/libopenxr_loader.so \
            lib/arm64-v8a/libmupen64plus-video-GLideN64.so
          do
            if ! grep -Fxq "$library" /tmp/kq64-apk-files.txt; then
              echo "Missing required Quest arm64 library: $library"
              grep '^lib/arm64-v8a/' /tmp/kq64-apk-files.txt | sort
              exit 1
            fi
          done

      - name: Write APK checksum
        run: |
          cd app/build/outputs/apk/release
          sha256sum KQ64-release.apk > KQ64-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KQ64-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/KQ64-release.apk
            app/build/outputs/apk/release/KQ64-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: KQ64-${{ github.sha }}
          path: dist

      - name: Name release files
        run: |
          mv dist/KQ64-release.apk "dist/KQ64-${GITHUB_REF_NAME}.apk"
          mv dist/KQ64-release.apk.sha256 "dist/KQ64-${GITHUB_REF_NAME}.apk.sha256"
          sed -i "s#KQ64-release.apk#KQ64-${GITHUB_REF_NAME}.apk#g" "dist/KQ64-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: KQ64 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist/KQ64-${{ github.ref_name }}.apk
            dist/KQ64-${{ github.ref_name }}.apk.sha256
