name: KQ64

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KQ64
    runs-on: ubuntu-latest

    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file gawk unzip

      - name: Configure persistent signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Using the repository signing key."
          else
            echo "::warning::DEBUG_KEYSTORE is not configured. This CI build will use a runner-generated debug key and must not be published as an update."
          fi

      - name: Report signing key for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::warning::DEBUG_KEYSTORE is not set, so this release is signed with a key generated for this build alone. It will not install over an existing KQ64, and the next release will not install over it. tools/setup-signing.sh sets the key permanently."
          else
            echo "Signed with the persistent repository key."
          fi

      - name: Validate generated Quest VR shader literals
        run: |
          perl -ne '
            if (/(?<!\\)\\\\n"/) {
              print "$ARGV: accidental literal \\\\n in generated GLSL: $_";
              $bad = 1;
            }
            END { exit($bad ? 1 : 0); }
          ' \
            mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_CombinerProgramBuilderCommon.cpp \
            mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_CombinerProgramBuilderAccurate.cpp \
            mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_CombinerProgramBuilderFast.cpp \
            mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_SpecialShadersFactory.cpp \
            mupen64plus-video-gliden64/upstream/src/Graphics/OpenGLContext/GLSL/glsl_FXAA.cpp

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee kq64-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KQ64-build-log-${{ github.sha }}
          path: kq64-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Quest arm64 APK contents
        run: |
          apk="app/build/outputs/apk/release/KQ64-release.apk"
          test -f "$apk"
          unzip -Z1 "$apk" > /tmp/kq64-apk-files.txt
          for library in \
            lib/arm64-v8a/libmupen64plus-quest-vr.so \
            lib/arm64-v8a/libopenxr_loader.so \
            lib/arm64-v8a/libmupen64plus-video-GLideN64.so
          do
            if ! grep -Fxq "$library" /tmp/kq64-apk-files.txt; then
              echo "Missing required Quest arm64 library: $library"
              grep '^lib/arm64-v8a/' /tmp/kq64-apk-files.txt | sort
              exit 1
            fi
          done

      - name: Write APK checksum
        run: |
          cd app/build/outputs/apk/release
          sha256sum KQ64-release.apk > KQ64-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KQ64-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/KQ64-release.apk
            app/build/outputs/apk/release/KQ64-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: KQ64-${{ github.sha }}
          path: dist

      - name: Name release files
        run: |
          mv dist/KQ64-release.apk "dist/KQ64-${GITHUB_REF_NAME}.apk"
          mv dist/KQ64-release.apk.sha256 "dist/KQ64-${GITHUB_REF_NAME}.apk.sha256"
          sed -i "s#KQ64-release.apk#KQ64-${GITHUB_REF_NAME}.apk#g" "dist/KQ64-${GITHUB_REF_NAME}.apk.sha256"

      - name: Compose release body
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            cp RELEASE_NOTES.md release-body.md
            exit 0
          fi
          cat > release-body.md <<'NOTICE'
          > **Uninstall any earlier KQ64 before installing this build.**
          > It is signed with a key generated during the build, so Android will
          > refuse to install it over an existing copy. Back up your saves first,
          > because uninstalling deletes them.

          NOTICE
          cat RELEASE_NOTES.md >> release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: KQ64 ${{ github.ref_name }}
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist/KQ64-${{ github.ref_name }}.apk
            dist/KQ64-${{ github.ref_name }}.apk.sha256
